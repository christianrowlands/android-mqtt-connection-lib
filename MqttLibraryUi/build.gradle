// Build script for the Craxiom MQTT Connection library UI: the connection fragment that sits on top
// of the core mqtt-library. Publishing is configured in ../publishing.gradle.

plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id 'nu.studer.credentials' version '3.0'
}

ext {
    pomArtifactId = 'mqtt-library-ui'
    pomName = 'MQTT Connection Library UI'
    pomDescription = 'An MQTT connection UI for the Craxiom MQTT Connection library'
}

android {
    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 15
        versionName version

        setProperty("archivesBaseName", "mqtt-library-ui-$versionName")
    }

    namespace 'com.craxiom.mqttlibrary.ui'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable += ['AllowBackup', 'GoogleAppIndexingWarning', 'MissingApplicationIcon']
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':MqttLibrary')

    // api because AConnectionFragment's subclasses see its Fragment and MaterialSwitch types
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'com.google.android.material:material:1.13.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'
}

apply from: rootProject.file('publishing.gradle')
