// Build script for the Craxiom MQTT Connection library (the connection, without any UI).
// Publishing is configured in ../publishing.gradle.

plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id 'nu.studer.credentials' version '3.0'
}

ext {
    pomArtifactId = 'mqtt-library'
    pomName = 'MQTT Connection Library'
    pomDescription = 'An MQTT connection controller that can be used in an Android app'
}

android {
    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 15
        versionName version

        setProperty("archivesBaseName", "$applicationName-$versionName")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    namespace 'com.craxiom.mqttlibrary'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable += ['AllowBackup', 'GoogleAppIndexingWarning', 'MissingApplicationIcon']
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.11.0'
    compileOnly 'com.google.android.things:androidthings:1.0'

    implementation 'com.hivemq:hivemq-mqtt-client:1.4.1'

    // api because the protected publishMessage takes a protobuf MessageOrBuilder
    api "com.google.protobuf:protobuf-java-util:4.36.2"
    implementation 'com.jakewharton.timber:timber:5.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

apply from: rootProject.file('publishing.gradle')
